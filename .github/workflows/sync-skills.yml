name: sync-skills

on:
  schedule:
    # Sunday 03:00 UTC — weekly refresh
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run sync script
        id: sync
        run: |
          python -m pip install PyYAML
          # Exit 3: some upstream skills were rejected (not portable to every client
          # platform, or unreadable); the valid rest is committed below and the run
          # then fails. Any other failure stops here and nothing is committed.
          status=0
          python scripts/sync_skills.py || status=$?
          if [[ "$status" -eq 3 ]]; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Detect changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain skills/ README.md library_sources.json library_index.json)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No skill, provenance, or count changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            added=$(git status --porcelain skills/ | grep -c '^??' || true)
            modified=$(git status --porcelain skills/ | grep -c '^ M' || true)
            deleted=$(git status --porcelain skills/ | grep -c '^ D' || true)
            echo "added=$added" >> "$GITHUB_OUTPUT"
            echo "modified=$modified" >> "$GITHUB_OUTPUT"
            echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          ADDED: ${{ steps.changes.outputs.added }}
          MODIFIED: ${{ steps.changes.outputs.modified }}
          DELETED: ${{ steps.changes.outputs.deleted }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README headline counts and the installer's library index are
          # regenerated from the live tree by the sync script; stage them
          # alongside skills/ so they stay in lockstep.
          git add skills/ README.md library_sources.json library_index.json
          today=$(date -u +%Y-%m-%d)
          git commit -m "chore: weekly upstream skill sync (${today})

          added: ${ADDED}
          modified: ${MODIFIED}
          deleted: ${DELETED}"
          git push

      - name: Fail on rejected upstream skills
        if: steps.sync.outputs.rejected == 'true'
        run: |
          echo "::error::Upstream skills were rejected; the valid rest was committed. See the REJECTED lines in the sync step."
          exit 1
